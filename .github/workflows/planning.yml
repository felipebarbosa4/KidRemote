name: Planning checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-09-05
        with:
          persist-credentials: false
      - name: Validate repository planning
        run: node tools/validate.mjs
      - name: Check patch whitespace
        run: git show --format= --check HEAD
  android-enforcement-spike:
    name: Android enforcement spike
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-09-05
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0, verified 2026-09-05
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled stable Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
      - name: Build, unit test and lint isolated spike
        working-directory: spikes/android-enforcement
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify expected unit-test execution
        working-directory: spikes/android-enforcement
        run: |
          test_count="$(grep -h '<testcase ' app/build/test-results/testDebugUnitTest/TEST-*.xml | wc -l)"
          test "$test_count" -eq 12
      - name: Audit merged spike manifest
        working-directory: spikes/android-enforcement
        run: |
          manifest_path="$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml -print -quit)"
          test -n "$manifest_path"
          grep -q 'android.permission.PACKAGE_USAGE_STATS' "$manifest_path"
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$manifest_path"
          if grep -q 'android.permission.INTERNET' "$manifest_path"; then
            echo 'Unexpected Internet permission in merged manifest' >&2
            exit 1
          fi
