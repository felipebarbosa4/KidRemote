name: Planning checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parent-foundation:
    name: KR-006 local Auth and parent APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Local Auth, email, PostgREST and regression tests
        run: |
          node --test tools/kr006/*.test.mjs
          node --test tools/kr007/*.test.mjs
          node tools/kr004/test-local-db.mjs docker unix:///var/run/docker.sock --enrollment-test
      - name: Build parent with preinstalled SDK only
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0" || test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          if test -x "$ANDROID_HOME/emulator/emulator"; then echo EMULATOR_BINARY=AVAILABLE; else echo EMULATOR_BINARY=ABSENT; fi
          if test -d "$ANDROID_HOME/system-images" && find "$ANDROID_HOME/system-images" -name system.img -print -quit | grep -q .; then echo EMULATOR_SYSTEM_IMAGE=AVAILABLE; else echo EMULATOR_SYSTEM_IMAGE=ABSENT; fi
          if test -r /dev/kvm && test -w /dev/kvm; then echo KVM_ACCESS=AVAILABLE; else echo KVM_ACCESS=UNAVAILABLE; fi
          spikes/android-enforcement/gradlew -p apps/parent-mobile --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest lintRelease assembleRelease
          node tools/kr006/audit-parent.mjs
          node tools/kr007/audit-child.mjs
      - name: Retain debug APK only (no accounts, mail or local-service data)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kr006-parent-debug
          path: apps/parent-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Retain child APKs only (no runtime fixtures)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kr007-child-apks
          path: |
            apps/child-android/build/outputs/apk/debug/child-debug.apk
            apps/child-android/build/outputs/apk/androidTest/debug/child-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Retain test APK only (compilation is not runtime evidence)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kr006-parent-instrumentation
          path: apps/parent-mobile/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
  database-isolation:
    name: KR-004 local migrations and client-role RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute complete KR-004 local pre-exposure checks
        run: node tools/kr004/check-local.mjs docker unix:///var/run/docker.sock
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-09-05
        with:
          persist-credentials: false
      - name: Validate repository planning
        run: node tools/validate.mjs
      - name: Test evidence ingestion and least-privilege rejection
        run: node --test tools/kr003/*.test.mjs
      - name: Test qualification runner without a device
        run: |
          pwsh -NoProfile -File tools/kr003/Qualification.Tests.ps1
          pwsh -NoProfile -File tools/kr003/OracleTransport.Tests.ps1
          pwsh -NoProfile -File tools/kr003/UiAutomationTransport.Tests.ps1
          pwsh -NoProfile -File tools/kr003/MonkeyTransport.Tests.ps1
          pwsh -NoProfile -File tools/kr003/DevicePreflight.Tests.ps1
          pwsh -NoProfile -File tools/kr003/OracleCalibration.Tests.ps1
          pwsh -NoProfile -File tools/kr003/PowerShellSafety.Tests.ps1
          pwsh -NoProfile -File tools/kr003/OracleCalibrationEntrypoint.Tests.ps1
          pwsh -NoProfile -File tools/kr003/QualificationEntrypoint.Tests.ps1
          pwsh -NoProfile -File tools/kr003/DualHomeDiagnosticEntrypoint.Tests.ps1
          pwsh -NoProfile -File tools/kr003/VisualCalibration.Tests.ps1
          pwsh -NoProfile -File tools/kr003/VisualDedup.Tests.ps1
          pwsh -NoProfile -File tools/kr003/ReferenceVideo.Tests.ps1
          pwsh -NoProfile -File tools/kr003/ReferenceVideoOrchestration.Tests.ps1
          pwsh -NoProfile -File tools/kr003/VisualCalibrationEntrypoint.Tests.ps1
      - name: Test finalization and recovery without a device
        run: pwsh -NoProfile -File tools/kr003/Runner.Tests.ps1
      - name: Check patch whitespace
        run: git show --format= --check HEAD
  android-enforcement-spike:
    name: Android enforcement spike
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-09-05
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0, verified 2026-09-05
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled stable Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
      - name: Build, unit test and lint isolated spike
        working-directory: spikes/android-enforcement
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug lintRelease assembleRelease
      - name: Audit executed tests, both merged manifests and release DEX isolation
        run: node tools/kr003/audit-build.mjs
  windows-runner-tests:
    name: Windows PowerShell runner tests (no device)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing pinned action
        with:
          persist-credentials: false
      - name: Exercise StrictMode finalization and recovery under Windows PowerShell
        shell: powershell
        run: |
          ./tools/kr003/Qualification.Tests.ps1
          ./tools/kr003/Runner.Tests.ps1
          ./tools/kr003/OracleTransport.Tests.ps1
          ./tools/kr003/UiAutomationTransport.Tests.ps1
          ./tools/kr003/MonkeyTransport.Tests.ps1
          ./tools/kr003/DevicePreflight.Tests.ps1
          ./tools/kr003/OracleCalibration.Tests.ps1
          ./tools/kr003/PowerShellSafety.Tests.ps1
          ./tools/kr003/OracleCalibrationEntrypoint.Tests.ps1
          ./tools/kr003/QualificationEntrypoint.Tests.ps1
          ./tools/kr003/DualHomeDiagnosticEntrypoint.Tests.ps1
          ./tools/kr003/VisualCalibration.Tests.ps1
          ./tools/kr003/VisualDedup.Tests.ps1
          ./tools/kr003/ReferenceVideo.Tests.ps1
          ./tools/kr003/ReferenceVideoCodec.Tests.ps1
          ./tools/kr003/ReferenceComparator.Tests.ps1
          ./tools/kr003/ReferenceVideoOrchestration.Tests.ps1
          ./tools/kr003/ReferenceVideoEntrypoint.Tests.ps1
          ./tools/kr003/ReferenceVideoRecorder.Tests.ps1
          ./tools/kr003/VisualCalibrationEntrypoint.Tests.ps1
          ./tools/kr003/VisualCaptureWorker.Tests.ps1
          ./tools/kr003/VisualBailoutEntrypoint.Tests.ps1
      - name: Exercise diagnostic and shared runner under PowerShell 7
        shell: pwsh
        run: |
          ./tools/kr003/Qualification.Tests.ps1
          ./tools/kr003/Runner.Tests.ps1
          ./tools/kr003/PowerShellSafety.Tests.ps1
          ./tools/kr003/QualificationEntrypoint.Tests.ps1
          ./tools/kr003/DualHomeDiagnosticEntrypoint.Tests.ps1
          ./tools/kr003/VisualCalibration.Tests.ps1
          ./tools/kr003/VisualDedup.Tests.ps1
          ./tools/kr003/ReferenceVideo.Tests.ps1
          ./tools/kr003/ReferenceVideoCodec.Tests.ps1
          ./tools/kr003/ReferenceComparator.Tests.ps1
          ./tools/kr003/ReferenceVideoOrchestration.Tests.ps1
          ./tools/kr003/ReferenceVideoEntrypoint.Tests.ps1
          ./tools/kr003/ReferenceVideoRecorder.Tests.ps1
          ./tools/kr003/VisualCalibrationEntrypoint.Tests.ps1
          ./tools/kr003/VisualCaptureWorker.Tests.ps1
          ./tools/kr003/VisualBailoutEntrypoint.Tests.ps1
